<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>宠物智能硬件内容运营 · 问数 Agent</title>
<script>var DEFAULT_KEY="__AGENT_KEY__";</script>
<style>
:root{--navy:#1F3864;--blue:#2E5C9A;--line:#D9E1EC;--bg:#F5F7FA;--grey:#6B7C8F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#22303F;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;line-height:1.65}
header{background:linear-gradient(135deg,#1F3864,#2E5C9A);color:#fff;padding:18px 26px}
header h1{margin:0;font-size:20px;letter-spacing:.5px}
header p{margin:6px 0 0;font-size:13px;opacity:.92}
.badges{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:2px 12px;font-size:12px}
.wrap{display:grid;grid-template-columns:minmax(430px,45%) 1fr;gap:18px;padding:18px 22px 70px;align-items:start}
@media(max-width:1150px){.wrap{grid-template-columns:1fr}}
.card{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 2px 10px rgba(20,40,80,.08);margin-bottom:16px}
.card h2{font-size:15px;color:var(--navy);margin:0 0 10px;padding-left:9px;border-left:4px solid var(--blue)}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;resize:vertical}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
button{cursor:pointer;font:inherit}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 20px;font-weight:600}
.btn:hover{background:#16294a}
.btn.sec{background:#EEF3FA;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:#EEF3FA;border:1px solid var(--line);border-radius:16px;padding:3px 12px;font-size:12.5px;color:#33445C;cursor:pointer}
.chip:hover{background:#DCE8F8}
.keyline{margin-top:12px;font-size:12.5px;color:var(--grey)}
.keyline input{width:340px;max-width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
.stage{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:10px;background:#FCFDFF}
.stage.doing{border-color:#9BB8E0;box-shadow:0 0 0 3px rgba(46,92,154,.10)}
.stage.done{background:#FBFDF9}
.stage.err{border-color:#EFC9C7;background:#FDF7F7}
.stage h3{margin:0 0 7px;font-size:13.5px;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.stage h3 .t{font-weight:400;font-size:12px;color:var(--grey)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:12.5px}
.kv dt{color:var(--grey)}
.kv dd{margin:0;color:#22303F;word-break:break-word}
.why{margin-top:8px;padding:7px 10px;background:#F3F7FD;border-left:3px solid #9BB8E0;border-radius:0 6px 6px 0;font-size:12.3px;color:#3B4A5E}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#F7FAFF;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.kpi b{display:block;font-size:20px;color:var(--navy);line-height:1.25}
.kpi span{font-size:12px;color:var(--grey)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:6px 0 10px;flex-wrap:wrap}
.tab{padding:5px 13px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;background:#F2F6FC;font-size:12.5px;color:#33445C;cursor:pointer}
.tab.on{background:#fff;color:var(--navy);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:12.6px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}
th{background:#F2F6FC;color:var(--navy);font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:#FAFCFF}
.note{font-size:12.2px;color:var(--grey);background:#FFFBEA;border:1px solid #F2E3B3;border-radius:7px;padding:9px 11px;margin-top:12px;line-height:1.75}
.insight{background:#F3F9F1;border:1px solid #CFE4C4;border-radius:8px;padding:11px 13px;margin-top:12px;font-size:13.2px;line-height:1.85}
.insight b{color:#3B6B2C}
.empty{color:#93A2B4;font-size:13px;padding:26px 4px;text-align:center}
.err{background:#FDF2F2;border:1px solid #EFC9C7;color:#8E3B38;border-radius:7px;padding:9px 11px;font-size:12.6px;margin-top:10px;white-space:pre-wrap}
.chartbox{background:#FCFDFF;border:1px solid var(--line);border-radius:9px;padding:10px 14px 6px;margin-bottom:12px}
.charttitle{font-size:13px;color:var(--navy);font-weight:700;margin:2px 0 6px}
pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-size:11.8px;color:#2B3A4A;background:#F7FAFF;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
</style>

</head>
<body>
<header>
  <h1>宠物智能硬件内容运营 · 问数 Agent</h1>
  <p>用中文提问 → 大模型把它翻译成结构化查询 → 本地执行 → 大模型写出结论 → 出图并可导出 Excel</p>
  <div class="badges">
    <span class="badge">完全由大模型驱动 · 无预置答案</span>
    <span class="badge">数据已内嵌 4,375 条</span>
    <span class="badge">查询走字段白名单</span>
    <span class="badge">口径守卫 · 单文件离线可用</span>
  </div>
</header>
<div class="wrap">
  <div>
    <section class="card">
      <h2>① 提问</h2>
      <textarea id="q" placeholder="例如：&#10;  小佩和竞品的官方内容效率差多少？&#10;  哪个痛点播放量高但内容还不多？&#10;  猫砂盆这几年的内容量和互动率怎么变的？"></textarea>
      <div class="row">
        <button class="btn" id="run">运行 Agent</button>
        <button class="btn sec" id="clear">清空</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="keyline">
        DeepSeek API Key（本机演示已预填；<b>这个 Key 不随文件上传</b>）<br>
        <input id="key" type="password" placeholder="sk-...">
      </div>
      <div id="err" class="err" style="display:none"></div>
      <div id="jserr" class="err" style="display:none"></div>
    </section>
    <section class="card">
      <h2>② Agent 工作流程</h2>
      <div id="flow"><div class="empty">点上面的「运行 Agent」，这里会逐步展示它做了什么、为什么这么做。</div></div>
    </section>
  </div>
  <div>
    <section class="card">
      <h2>③ 结果</h2>
      <div id="result"><div class="empty">结果会显示在这里。</div></div>
    </section>
  </div>
</div>
<script>/*__DATA__*/</script>
<script>
/* 宠物智能硬件内容运营 · 问数 Agent
   所有业务判断交给大模型；本地只做：字段白名单约束、口径守卫、执行与渲染。 */

var META = DATA.meta, COLS = DATA.cols, RAW = DATA.rows;
var RECS = [];
(function () {
  var NAME = { t: "title", pl: "pline", c: "label", ct: "cat", b: "brands", pn: "pains",
               sc: "scenes", fm: "fmt", d: "duration", p: "play", l: "like", f: "fav",
               r: "reply", dm: "dm", it: "interact", fr: "fav_rate", y: "year", o: "official",
               m: "mid", k: "kw" };
  for (var i = 0; i < RAW[COLS[0]].length; i++) {
    var o = {};
    for (var j = 0; j < COLS.length; j++) o[NAME[COLS[j]] || COLS[j]] = RAW[COLS[j]][i];
    RECS.push(o);
  }
})();

var NL = String.fromCharCode(10);
function mean(a) { if (!a.length) return 0; var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
function median(a) {
  if (!a.length) return 0; var b = a.slice().sort(function (x, y) { return x - y; });
  var m = Math.floor(b.length / 2);
  return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2;
}
function uniqN(a) { var s = {}, n = 0; for (var i = 0; i < a.length; i++) { if (!s[a[i]]) { s[a[i]] = 1; n++; } } return n; }
function hasAny(arr, want) { for (var i = 0; i < want.length; i++) if (arr && arr.indexOf(want[i]) >= 0) return true; return false; }

var METRICS = {
  count:          { label: "内容量",         fmt: "int" },
  play_median:    { label: "播放中位数",     fmt: "int" },
  play_mean:      { label: "播放均值",       fmt: "int" },
  interact_mean:  { label: "互动率",         fmt: "pct" },
  fav_rate_mean:  { label: "收藏率",         fmt: "pct" },
  like_median:    { label: "点赞中位数",     fmt: "int" },
  dm_per_1k:      { label: "每千次播放弹幕", fmt: "num2" },
  creators:       { label: "创作者数",       fmt: "int" },
  official_share: { label: "官方内容占比",   fmt: "pct" }
};
function calcMetric(m, rs) {
  switch (m) {
    case "count": return rs.length;
    case "play_median": return median(rs.map(function (r) { return r.play; }));
    case "play_mean": return mean(rs.map(function (r) { return r.play; }));
    case "interact_mean": return mean(rs.map(function (r) { return r.interact || 0; }));
    case "fav_rate_mean": return mean(rs.map(function (r) { return r.fav_rate || 0; }));
    case "like_median": return median(rs.map(function (r) { return r.like; }));
    case "dm_per_1k": return mean(rs.map(function (r) { return r.play ? r.dm / r.play * 1000 : 0; }));
    case "creators": return uniqN(rs.map(function (r) { return r.mid; }));
    case "official_share": return rs.length ? mean(rs.map(function (r) { return r.official; })) : 0;
    default: return 0;
  }
}
function fmtVal(v, fmt) {
  if (v === null || v === undefined || isNaN(v)) return "-";
  if (fmt === "pct") return (v * 100).toFixed(2) + "%";
  if (fmt === "num2") return v.toFixed(2);
  return Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("zh-CN") : String(Math.round(v * 100) / 100);
}

var GROUP_BY = ["label", "pline", "cat", "brands", "pains", "scenes", "fmt", "kw", "year", "official", "duration_bin", "tier"];
var GROUP_LABEL = { label: "标签层", pline: "产品线", cat: "产品线(词典)", brands: "品牌", pains: "痛点",
                    scenes: "场景", fmt: "内容形态", kw: "采集关键词", year: "年份",
                    official: "来源", duration_bin: "时长档", tier: "创作者层级" };
function durationBin(r) { var d = r.duration; return d < 60 ? "<1min" : (d < 180 ? "1-3min" : (d < 600 ? "3-10min" : ">10min")); }
var TIER_MAP = null, TIER_KEY = "";
function tierOf(r, rows) {
  var key = rows.length + "|" + (rows[0] ? rows[0].title : "");
  if (TIER_KEY !== key) {
    var sorted = rows.slice().sort(function (a, b) { return b.play - a.play; });
    TIER_MAP = {};
    for (var i = 0; i < sorted.length; i++) {
      var pp = i / Math.max(1, sorted.length);
      TIER_MAP[sorted[i].title] = pp < 0.1 ? "头部(前10%)" : (pp < 0.4 ? "腰部(10-40%)" : "长尾(40-100%)");
    }
    TIER_KEY = key;
  }
  return TIER_MAP[r.title] || "长尾(40-100%)";
}
function groupKeys(r, gb, rows) {
  switch (gb) {
    case "label": return [r.label];
    case "pline": return [r.pline || "未判定"];
    case "cat": return [r.cat || "未匹配"];
    case "brands": return (r.brands && r.brands.length) ? r.brands : ["未提及品牌"];
    case "pains": return (r.pains && r.pains.length) ? r.pains : ["未识别痛点"];
    case "scenes": return (r.scenes && r.scenes.length) ? r.scenes : ["未标注场景"];
    case "fmt": return [r.fmt || "其他"];
    case "kw": return [r.kw || "未知"];
    case "year": return [String(r.year || "未知")];
    case "official": return [r.official ? "官方账号" : "达人/用户"];
    case "duration_bin": return [durationBin(r)];
    case "tier": return [tierOf(r, rows)];
    default: return ["全部"];
  }
}

function schemaText() {
  var L = [];
  L.push("数据表 records：" + META.n_rows + " 行，每行是一条 B站 内容。字段如下：");
  L.push("  title     string   标题");
  L.push("  label     string   相关性四级  A=智能硬件本体  B=耗材/非智能用品  C=健康养护等用户语境  N=非宠物(搜索噪声)");
  L.push("  pline     string   产品线（大模型判定）：" + META.product_lines.join(" / "));
  L.push("  cat       string   词典产品线（可能为空）：" + META.cats.join(" / "));
  L.push("  brands    string[] 提到的品牌：" + META.brands.join(" / "));
  L.push("  pains     string[] 用户痛点：" + META.pains.join(" / "));
  L.push("  scenes    string[] 使用场景：" + META.scenes.join(" / "));
  L.push("  fmt       string   内容形态：" + META.formats.join(" / "));
  L.push("  duration  int      视频秒数");
  L.push("  play/like/fav/reply/dm  int  播放量/点赞/收藏/评论/弹幕");
  L.push("  interact  float    互动率 =(点赞+收藏+评论+弹幕)/播放");
  L.push("  fav_rate  float    收藏率");
  L.push("  year      int      发布年份，数据覆盖 " + META.year_range[0] + "~" + META.year_range[1]);
  L.push("  official  0/1      是否品牌官方账号");
  L.push("  mid       string   创作者 ID（用于去重计数）");
  L.push("  kw        string   采集用的关键词：" + META.keywords.join(" / "));
  L.push("");
  L.push("已知的层级分布：A=" + META.label_dist.A + " 条, B=" + META.label_dist.B + " 条, C=" + META.label_dist.C + " 条, N=" + META.label_dist.N + " 条。");
  return L.join(NL);
}
function planPrompt(question) {
  return [
    "你是一个宠物智能硬件内容运营的数据分析 Agent。",
    "你的唯一任务：把用户的中文问题翻译成一个结构化查询（JSON）。不要回答业务问题本身。",
    "",
    "# 数据",
    schemaText(),
    "",
    "# 输出格式（只输出一个 JSON，不要任何解释文字、不要代码块标记）",
    "{",
    '  "intent": "一句话说明你要查什么",',
    '  "filter": {',
    '    "label": ["A"],              // 可选，标签层筛选',
    '    "pline": ["猫砂盆"],          // 可选',
    '    "cat": ["猫砂盆"], "brands": ["小佩"], "pains": ["异味/除臭"], "scenes": ["多猫"], "fmt": ["横评/选购"], "kw": ["猫砂盆"],',
    '    "official": 1,               // 可选，1=只看官方 0=只看非官方',
    '    "year_min": 2023, "year_max": 2025,',
    '    "duration_min": 600, "duration_max": null,',
    '    "title_contains": "横评",    // 可选，标题包含某词',
    '    "play_min": 10000            // 可选',
    "  },",
    '  "group_by": "pline",           // 可选：' + GROUP_BY.join("/") + ' ；不分组就写 null',
    '  "metrics": ["count","interact_mean"],   // 可选值：' + Object.keys(METRICS).join("/"),
    '  "sort_by": "interact_mean",    // 必须是 metrics 里的某一项；不排序写 null',
    '  "sort_desc": true,',
    '  "limit": 20,',
    '  "chart": {"type":"bar","x":"pline","y":"interact_mean"},',
    '  "focus": "写结论时要重点说明什么"',
    "}",
    "",
    "# 要求",
    "1. metrics 至少一项；group_by 为 null 时就只算整体一个数。",
    "2. chart.type 只能是 bar / hbar / groupbar / line / scatter / none。",
    "   bar=竖柱  hbar=横条(类别多或名称长时用)  groupbar=多指标并列  line=时间趋势  scatter=两指标散点",
    "3. 如果用户问的是产品线或品牌，filter.label 默认写 [A]。",
    "4. 如果问题只能靠非 A 级才有意义（问耗材、问养护、问萌宠日常），filter.label 写 [A,B,C]。",
    "5. 只输出 JSON，一个字都不要多写。",
    "",
    "用户的问题是：" + question
  ].join(NL);
}
function parseJSON(text) {
  var fence = String.fromCharCode(96, 96, 96);
  var t = String(text || "").trim();
  if (t.indexOf(fence) === 0) {
    var end = t.indexOf(fence, 3);
    if (end > 0) t = t.slice(end + 3).trim();
  }
  try { return JSON.parse(t); } catch (e) {}
  var i = t.indexOf("{"), j = t.lastIndexOf("}");
  if (i >= 0 && j > i) {
    var seg = t.slice(i, j + 1);
    try { return JSON.parse(seg); } catch (e2) {}
    try { return JSON.parse(seg.replace(/,\s*([}\]])/g, "$1")); } catch (e3) {}
  }
  throw new Error("模型没有返回合法 JSON");
}
async function askLLM(messages, key, maxTokens, temperature) {
  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 45000) : null;
  var r;
  try {
    r = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ model: "deepseek-chat", temperature: temperature === undefined ? 0 : temperature,
                             max_tokens: maxTokens || 900, messages: messages }),
      signal: ctrl ? ctrl.signal : undefined
    });
  } catch (e) {
    if (e && e.name === "AbortError") throw new Error("请求超时（45 秒未响应）");
    throw new Error("网络不可达：" + String((e && e.message) || e));
  } finally { if (timer) clearTimeout(timer); }
  if (!r.ok) {
    var body = "";
    try { body = (await r.text()).slice(0, 200); } catch (e2) {}
    throw new Error("DeepSeek 返回 HTTP " + r.status + (body ? "：" + body : ""));
  }
  var j = await r.json();
  return ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "").trim();
}

var DISCIPLINE = {
  pline:        { label: ["A"],           why: "产品线结论只用 A 级（智能硬件本体）" },
  cat:          { label: ["A"],           why: "产品线结论只用 A 级" },
  brands:       { label: ["A"],           why: "品牌结论只用 A 级" },
  pains:        { label: ["A", "B", "C"], why: "痛点属于需求与语境，用 A+B+C，剔除 N 级（非宠物）" },
  scenes:       { label: ["A", "B", "C"], why: "场景属于需求与语境，用 A+B+C" },
  fmt:          { label: ["A", "B"],      why: "内容策略用 A+B（硬件本体 + 耗材日用）" },
  duration_bin: { label: ["A", "B"],      why: "内容策略用 A+B" },
  tier:         { label: ["A", "B"],      why: "创作者投放策略用 A+B" }
};
function guardQuery(q, question) {
  var notes = [];
  var f = q.filter || (q.filter = {});
  var d = DISCIPLINE[q.group_by];
  if (d) {
    var explicitOther = /耗材|养护|日常|萌宠|非硬件|全部层级|所有层级|不加限制/.test(question || "");
    var cur = f.label;
    if (!cur || !cur.length) {
      f.label = d.label.slice();
      notes.push("按项目纪律自动把标签层设为 " + f.label.join("+") + " —— " + d.why + "。");
    } else if (!explicitOther) {
      var missing = d.label.filter(function (x) { return cur.indexOf(x) < 0; });
      if (missing.length) {
        notes.push("模型给的标签层是 " + cur.join("+") + "，但该分组要求 " + d.label.join("+") + "，已按纪律收紧（" + d.why + "）。");
        f.label = d.label.slice();
      }
    }
  }
  if (q.group_by && GROUP_BY.indexOf(q.group_by) < 0) {
    notes.push("模型给的分组维度「" + q.group_by + "」不在白名单里，已改为不分组。");
    q.group_by = null;
  }
  var ms = (q.metrics || []).filter(function (m) { return METRICS[m]; });
  if (!ms.length) { ms = ["count"]; notes.push("模型没有给出有效指标，已默认统计内容量。"); }
  if (ms.length !== (q.metrics || []).length) notes.push("模型给的指标里有不存在的，已剔除。");
  q.metrics = ms;

      "",

      "1. 第一句就给最重要的数字结论（带具体数字）；",
      "2. 如果有反直觉或值得警惕的地方，点出来；",
      "3. 最后给一条可执行的运营建议；",
      "4. 不要写标题，不要用 Markdown 语法，直接写正文。"
    ];
    if (q.focus) sumLines.push("5. 重点关注：" + q.focus);
    var conclusion = "";
    try {
      conclusion = await askLLM([{ role: "user", content: sumLines.join(NL) }], key, 700, 0.3);
    } catch (e) {
      conclusion = "（大模型写结论失败：" + String((e && e.message) || e) + "）本次仍可在下方看到完整结果表与图表。";
    }
    stageEnd(4, Date.now() - t0, kv([["输入给模型的表", tableText.split(NL).length + " 行"], ["结论字数", conclusion.length + " 字"]]) +
      why("数字全部来自本地执行结果，模型只负责<b>解读</b>，不负责生成数字。"));

    t0 = stageStart(5, "阶段 6 · 渲染与导出");
    renderResult(q, res, question, notes, conclusion);
    stageEnd(5, Date.now() - t0, kv([["渲染", "完成"], ["导出", "可下载 Excel 工作簿"]]) +
      why("工作簿第 1 张固定是「说明与数据性质」，任何人拿到都能看懂哪些能用、哪些不能。"));
  } catch (e) {
    var msg = (e && e.message) ? e.message : String(e);
    errBox.style.display = "block";
    errBox.textContent = msg;
    document.getElementById("result").innerHTML = '<div class="empty">' + esc(msg) + "</div>";
    for (var fi = FLOW.length - 1; fi >= 0; fi--) { if (FLOW[fi]) { stageFail(fi, 0, kv([["失败原因", esc(msg)]])); break; } }
  } finally {
    document.getElementById("run").disabled = false;
  }
}
function tableToCSV(table) {
  if (!table.length) return "（无数据）";
  var keys = Object.keys(table[0]).filter(function (k) { return k.charAt(0) !== "_"; });
  var lines = [keys.join(",")];
  for (var i = 0; i < Math.min(30, table.length); i++) lines.push(keys.map(function (k) { return String(table[i][k]); }).join(","));
  return lines.join(NL);
}
function renderResult(q, res, question, notes, conclusion) {
  CURRENT = { q: q, res: res, question: question, notes: notes, conclusion: conclusion };
  var h = '<div class="kpis">';
  for (var i = 0; i < res.kpis.length; i++) h += '<div class="kpi"><b>' + esc(res.kpis[i].v) + "</b><span>" + esc(res.kpis[i].l) + "</span></div>";
  h += "</div>";
  h += '<div id="chart" class="chartbox"></div>';
  h += '<div class="tabs" id="tabs"><div class="tab" data-i="0">AI 解读</div><div class="tab" data-i="1">结果表</div>' +
       '<div class="tab" data-i="2">查询与口径</div><div class="tab" data-i="3">说明与数据性质</div></div>';
  h += '<div id="tbl"></div>';
  h += '<div class="row" style="margin-top:14px"><button class="btn" id="dlx">下载 Excel（含数据性质声明）</button>' +
       '<button class="btn sec" id="copyq">复制本次问句</button></div>';
  h += '<div class="note">导出的工作簿包含：<b>说明与数据性质</b>（第 1 张，必读）、<b>AI 解读</b>、<b>结果表</b>、<b>查询与口径</b>。文件名：<b id="fname"></b></div>';
  document.getElementById("result").innerHTML = h;
  document.getElementById("chart").innerHTML = '<div class="charttitle">' + esc(chartTitle(q, res)) + "</div>" + chartSVG(q.chart, res.table, q);
  function showTab(i) {
    var tabs = document.querySelectorAll("#tabs .tab");
    for (var t = 0; t < tabs.length; t++) tabs[t].className = "tab" + (t === i ? " on" : "");
    var box = document.getElementById("tbl");
    if (i === 0) box.innerHTML = '<div class="insight" style="margin-top:0">' + esc(conclusion).replace(/\n/g, "<br>") + "</div>";
    else if (i === 1) box.innerHTML = tableHtml(res.table);
    else if (i === 2) box.innerHTML = queryHtml(q, res, notes);
    else box.innerHTML = noteHtml(notes);
  }
  var tabs = document.querySelectorAll("#tabs .tab");
  for (var t2 = 0; t2 < tabs.length; t2++) tabs[t2].onclick = (function (i) { return function () { showTab(i); }; })(parseInt(tabs[t2].dataset.i, 10));
  showTab(0);
  document.getElementById("fname").textContent = workbookName(q);
  document.getElementById("dlx").onclick = function () {
    try { exportExcel(CURRENT); } catch (e) { alert("导出失败：" + ((e && e.message) || e)); }
  };
  document.getElementById("copyq").onclick = function () { try { navigator.clipboard.writeText(question); } catch (e) {} this.textContent = "已复制"; };
}
function chartTitle(q, res) {
  var ml = metricLabelsOf(q);
  if (q.chart && q.chart.type === "groupbar") {
    var ys = q.chart.y; if (typeof ys === "string") ys = [ys];
    return res.groupName + " × " + (ys || ml.slice(0, 2)).join(" / ");
  }
  var y = q.chart && q.chart.y;
  var yl = (typeof y === "string" && METRICS[y]) ? METRICS[y].label : ml[0];
  return res.groupName + " × " + yl;
}
function tableHtml(table) {
  if (!table || !table.length) return '<div class="empty">没有数据</div>';
  var keys = Object.keys(table[0]).filter(function (k) { return k.charAt(0) !== "_"; });
  var h = "<table><thead><tr>";
  for (var i = 0; i < keys.length; i++) h += "<th>" + esc(keys[i]) + "</th>";
  h += "</tr></thead><tbody>";
  for (var r = 0; r < table.length; r++) {
    h += "<tr>";
    for (var c = 0; c < keys.length; c++) {
      var v = table[r][keys[c]];
      h += "<td>" + esc(typeof v === "number" ? Math.round(v * 10000) / 10000 : v) + "</td>";
    }
    h += "</tr>";
  }
  return h + "</tbody></table>";
}
function queryHtml(q, res, notes) {
  var nh = "";
  for (var i = 0; i < notes.length; i++) nh += "<div>· " + esc(notes[i]) + "</div>";
  return '<div class="insight" style="margin-top:0"><b>这次 Agent 做了什么</b><br>' +
    "① 大模型把问题翻译成了结构化查询：" + pre(JSON.stringify(q, null, 2)) +
    "② 口径守卫的调整：" + (nh || "<div>· 本次无调整。</div>") +
    "③ 本地执行：命中 " + res.rows.length.toLocaleString("zh-CN") + " 条，得到 " + res.table.length + " 组结果。</div>";
}
function noteHtml(notes) {
  var nh = "";
  for (var i = 0; i < notes.length; i++) nh += "<div>· " + esc(notes[i]) + "</div>";
  return '<div class="note" style="margin-top:0"><b>数据性质声明（请先读）</b><br>' +
    "① 数据来自 B站 35 个关键词的搜索结果，<b>不是随机抽样</b>，只能做相对比较，<b>不能推算市场规模或份额</b>。<br>" +
    "② " + META.n_rows + " 条内容由大模型标注：与人工分层随机抽检的一致率为 <b>" + META.accuracy.main +
    "%</b>（Wilson 95%CI " + META.accuracy.ci[0] + "%~" + META.accuracy.ci[1] + "%），后分层加权 " + META.accuracy.post + "%。<br>" +
    "③ 单一标注者、无重复核验；二轮盲判复核发现人工自身自洽率仅 " + META.accuracy.self_consistency +
    "%，故上述准确率为保守值，真实区间约为 [" + META.accuracy.main + "%, " + META.accuracy.reviewed + "%]。<br>" +
    "④ 标签层含义：A=智能硬件本体；B=耗材/非智能用品；C=健康养护等用户语境；N=非宠物（搜索噪声）。<br>" +
    "⑤ 口径纪律：产品线与品牌结论只用 A 级；痛点/场景用 A+B+C；内容形态/时长/创作者分层用 A+B。<br><br>" +
    "<b>本次的口径守卫记录</b>" + (nh || "<div>· 本次无额外约束。</div>") + "</div>";
}
function workbookName(q) {
  var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
  return "宠物智能硬件内容运营_" + (q.group_by || "overall") + "_" + d.getFullYear() + p(d.getMonth() + 1) +
         p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes()) + ".xlsx";
}
function buildWorkbook(ctx) {
  if (typeof XLSX === "undefined") throw new Error("Excel 库未加载");
  var q = ctx.q, res = ctx.res, A = META.accuracy;
  var wb = XLSX.utils.book_new();
  var s1 = [
    ["宠物智能硬件内容运营 · 问数 Agent 输出", ""],
    ["问题", ctx.question],
    ["生成时间", new Date().toLocaleString("zh-CN")],
    ["数据规模", META.n_rows + " 条内容 / " + META.creators + " 位创作者（内嵌于本地，未上传）"],
    ["大模型意图", q.intent || ""],
    ["命中内容", res.rows.length + " 条"],
    ["分组维度", q.group_by || "不分组"],
    ["最终标签层", (q.filter && q.filter.label ? q.filter.label.join(" + ") : "") || "未限制"],
    [],
    ["⚠ 数据性质声明（请先读）", ""],
    ["① 抽样方式", "数据来自 B站 35 个关键词的搜索结果，不是随机抽样。只能做相对比较，不能推算市场规模或市场份额。"],
    ["② 标注质量", "共 " + META.n_rows + " 条内容由大模型标注：与人工分层随机抽检的一致率为 " + A.main +
                  "%（Wilson 95% 置信区间 " + A.ci[0] + "%~" + A.ci[1] + "%），后分层加权 " + A.post + "%。"],
    ["③ 已知噪声", "单一标注者、无重复核验；二轮盲判复核发现人工自身自洽率仅 " + A.self_consistency +
                  "%，故上述准确率为保守值，真实区间约为 [" + A.main + "%, " + A.reviewed + "%]。"],
    ["④ 口径纪律", "产品线与品牌结论只用 A 级（智能硬件本体）记录；痛点/场景用 A+B+C；内容形态/时长/创作者分层用 A+B。"],
    ["⑤ 标签层含义", "A=智能硬件本体；B=耗材/非智能用品；C=健康养护等用户语境；N=非宠物（搜索噪声）。"]
  ];
  for (var i = 0; i < ctx.notes.length; i++) s1.push(["口径守卫记录 " + (i + 1), ctx.notes[i]]);
  var ws1 = XLSX.utils.aoa_to_sheet(s1);
  ws1["!cols"] = [{ wch: 20 }, { wch: 94 }];
  XLSX.utils.book_append_sheet(wb, ws1, "说明与数据性质");
  var ws2 = XLSX.utils.aoa_to_sheet([["AI 解读"], [ctx.conclusion]]);
  ws2["!cols"] = [{ wch: 110 }];
  XLSX.utils.book_append_sheet(wb, ws2, "AI 解读");
  var qrows = [["本次的结构化查询"], [JSON.stringify(q, null, 2)], [], ["口径守卫调整"]];
  if (ctx.notes.length) for (var n = 0; n < ctx.notes.length; n++) qrows.push([ctx.notes[n]]);
  else qrows.push(["无"]);
  var ws3 = XLSX.utils.aoa_to_sheet(qrows);
  ws3["!cols"] = [{ wch: 110 }];
  XLSX.utils.book_append_sheet(wb, ws3, "查询与口径");
  var keys = Object.keys(res.table[0] || {}).filter(function (k) { return k.charAt(0) !== "_"; });
  var aoa = [keys], fmts = [];
  for (var r = 0; r < res.table.length; r++) {
    var row = [], fr = [];
    for (var c = 0; c < keys.length; c++) {
      var v = res.table[r][keys[c]];
      fr.push(null);
      if (typeof v === "string") {
        if (/^-?[\d,]+(\.\d+)?%$/.test(v)) { fr[c] = '0.00"%"'; v = Number(v.replace(/[,%]/g, "")); }
        else if (/^-?[\d,]+(\.\d+)?$/.test(v)) { fr[c] = "#,##0"; v = Number(v.replace(/,/g, "")); }
      }
      row.push(v === undefined || v === null ? "" : v);
    }
    aoa.push(row); fmts.push(fr);
  }
  var ws4 = XLSX.utils.aoa_to_sheet(aoa);
  for (var rr = 0; rr < fmts.length; rr++) {
    for (var cc = 0; cc < fmts[rr].length; cc++) {
      if (!fmts[rr][cc]) continue;
      var addr = XLSX.utils.encode_cell({ r: rr + 1, c: cc });
      if (ws4[addr]) ws4[addr].z = fmts[rr][cc];
    }
  }
  ws4["!cols"] = keys.map(function (k) { return { wch: Math.max(11, Math.min(42, k.length * 2 + 6)) }; });
  XLSX.utils.book_append_sheet(wb, ws4, "结果表");
  return { wb: wb, filename: workbookName(q) };
}
function exportExcel(ctx) {
  var x = buildWorkbook(ctx);
  XLSX.writeFile(x.wb, x.filename);
  return x.filename;
}

    "哪个痛点播放量高但内容还不多？",
    "视频做多长效果更好？",

    "猫砂盆的内容有多少条、表现如何？",

    "头部达人和腰部哪个划算？"
  ];
  var chips = document.getElementById("chips");
  for (var i = 0; i < SUGGEST.length; i++) {

    document.getElementById("err").style.display = "none";
  };
  document.getElementById("q").addEventListener("keydown", function (e) { if (e.ctrlKey && e.key === "Enter") run(); });
  window.addEventListener("error", function (ev) {
    var b = document.getElementById("jserr");

  window.addEventListener("unhandledrejection", function (ev) {
    var b = document.getElementById("jserr");
    var m = (ev.reason && ev.reason.message) ? ev.reason.message : String(ev.reason);
    if (b) { b.style.display = "block"; b.textContent = "异步错误：" + m; }
  });
})();
